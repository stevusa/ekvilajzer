name: Build Xwave 210 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.5.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          gradle --no-daemon clean :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
             output/Xwave210-Equalizer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xwave210-Equalizer-APK
          path: output/Xwave210-Equalizer.apk
