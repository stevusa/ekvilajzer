name: Build TVBox210 Equalizer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TVBox210Equalizer/**'
      - '.github/workflows/tvbox210.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: TVBox210Equalizer
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp TVBox210Equalizer/app/build/outputs/apk/debug/app-debug.apk TVBox210-Equalizer.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox210-Equalizer-APK
          path: TVBox210-Equalizer.apk
