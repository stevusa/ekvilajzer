name: Build Xwave 210 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.5.0
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Check files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          gradle --version
          gradle --no-daemon clean :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Xwave210-Equalizer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Xwave210-Equalizer-APK
          path: output/Xwave210-Equalizer.apk
          if-no-files-found: error
